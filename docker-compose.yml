# Production-shaped stack. For development use scripts/dev.sh, which layers
# docker-compose.dev.yml on top (hot reload + SearXNG exposed on localhost).
services:
  app:
    build:
      context: .
      target: prod
    ports:
      - "8090:8090"
    env_file:
      - path: .env
        required: false
    environment:
      SEARXNG_URL: http://searxng:8080
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      - searxng
    extra_hosts:
      # lets the container reach a llama.cpp/LLM server on the host, both
      # on Docker Desktop and on Linux
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  searxng:
    # Pinned by digest (upstream has changed limiter/format behavior across
    # releases). To upgrade deliberately: docker pull searxng/searxng:latest,
    # then update this digest.
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # A real secret is strongly preferred (see .env.example), but this
      # service has no published ports and is reachable only from the
      # internal network, so a missing one must not block a first run.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-insecure-default-change-me}
    restart: unless-stopped
    # No ports: only reachable from the internal Docker network.

  # Optional: run a local LLM in the stack instead of DeepSeek. Put a .gguf
  # in ./models, uncomment, then Settings → provider "local", base URL
  # http://llama:8080/v1
  # llama:
  #   image: ghcr.io/ggml-org/llama.cpp:server
  #   volumes:
  #     - ./models:/models
  #   command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "32768"]
  #   restart: unless-stopped

  # Optional: a headless browser that solves JavaScript bot challenges for
  # pages that refuse even a Chrome-fingerprint fetch. Opt in with:
  #   docker compose --profile browser up -d
  # and set BROWSER_SOLVER_URL=http://flaresolverr:8191 in .env (or the URL in
  # Settings). Internal-only: no ports are published on the host.
  flaresolverr:
    profiles: ["browser"]
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.1
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  # Optional: expose the UI on a public hostname through a Cloudflare Tunnel,
  # with no inbound ports opened on the host. Opt in with:
  #   docker compose --profile tunnel up -d
  # Put a Cloudflare Access policy in front of the hostname — the tunnel makes
  # the app reachable from the internet, and WEB_PASSWORD alone is thin cover.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    environment:
      # Plain default, not ${VAR:?...}: compose interpolates every service at
      # parse time, even ones behind an inactive profile, so a required-variable
      # form here breaks `docker compose up` for everyone without a tunnel.
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel run
    restart: unless-stopped
    depends_on:
      - app
