<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deep Research{% endblock %}</title>
  <link rel="icon" href="/static/favicon.png?v=4" type="image/png">
  <link rel="apple-touch-icon" href="/static/favicon.png?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css?v=4">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/app.js?v=4" defer></script>
</head>
<body>
  <nav class="topnav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.8;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Deep&nbsp;Research</span>
      </a>
      <ul>
        <li><a href="/" class="{{ 'active' if nav == 'home' else '' }}">New</a></li>
        <li><a href="/library" class="{{ 'active' if nav == 'library' else '' }}">Library</a></li>
        <li><a href="/graph" class="{{ 'active' if nav == 'graph' else '' }}">Graph</a></li>
        <li><a href="/ask" class="{{ 'active' if nav == 'ask' else '' }}">Ask</a></li>
        <li><a href="/readme" class="{% if nav == 'readme' %}active{% endif %}">Read Me</a></li>
        <li><a href="/settings" class="{{ 'active' if nav == 'settings' else '' }}">Settings</a></li>
      </ul>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
