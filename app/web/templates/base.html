<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Deep Research — AI-powered deep web research assistant">
  <title>{% block title %}Deep Research{% endblock %}</title>
  <link rel="icon" href="{{ asset('favicon-64.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ asset('favicon.png') }}">
  <link rel="stylesheet" href="{{ asset('vendor/inter.css') }}">
  <link rel="stylesheet" href="{{ asset('vendor/pico.min.css') }}">
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <script src="{{ asset('vendor/htmx.min.js') }}" defer></script>
  <script src="{{ asset('app.js') }}" defer></script>
</head>
<body>
  <nav class="topnav" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="Deep Research home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Deep&nbsp;Research</span>
      </a>
      <ul>
        <li><a href="/" class="{{ 'active' if nav == 'home' else '' }}">New</a></li>
        <li><a href="/library" class="{{ 'active' if nav == 'library' else '' }}">Library</a></li>
        <li><a href="/ask" class="{{ 'active' if nav == 'ask' else '' }}">Ask</a></li>
        <li><a href="/readme" class="{% if nav == 'readme' %}active{% endif %}">Read Me</a></li>
        <li><a href="/settings" class="{{ 'active' if nav == 'settings' else '' }}">Settings</a></li>
      </ul>
    </div>
  </nav>
  <main class="container fade-in">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <a href="https://lukewade.net" target="_blank" rel="noopener noreferrer" class="footer-btn">lukewade.net</a>
      <span class="footer-sep">·</span>
      <a href="https://builds.lukewade.net" target="_blank" rel="noopener noreferrer" class="footer-btn">builds.lukewade.net</a>
    </div>
    <p class="footer-copy">Powered by Deep Research</p>
  </footer>
</body>
</html>
