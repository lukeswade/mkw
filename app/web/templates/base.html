<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deep Research{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔭</text></svg>">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <nav class="topnav">
    <div class="nav-inner">
      <a class="brand" href="/">🔭 <span>Deep&nbsp;Research</span></a>
      <ul>
        <li><a href="/" class="{{ 'active' if nav == 'home' else '' }}">New</a></li>
        <li><a href="/library" class="{{ 'active' if nav == 'library' else '' }}">Library</a></li>
        <li><a href="/graph" class="{{ 'active' if nav == 'graph' else '' }}">Graph</a></li>
        <li><a href="/ask" class="{{ 'active' if nav == 'ask' else '' }}">Ask</a></li>
        <li><a href="/settings" class="{{ 'active' if nav == 'settings' else '' }}">Settings</a></li>
      </ul>
    </div>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
