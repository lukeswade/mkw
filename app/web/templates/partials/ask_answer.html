{% if error %}
<p class="banner banner-failed">{{ error }}</p>
{% else %}
<article class="card">
  <div class="prose">{{ answer_html | safe }}</div>
  {% if sources %}
  <h4>Drawn from</h4>
  <ul class="ask-sources">
    {% for s in sources %}
    <li><a href="/runs/{{ s.run_id }}">{{ s.title }}</a> <small>similarity {{ '%.2f' | format(s.score) }}</small></li>
    {% endfor %}
  </ul>
  {% endif %}
</article>
{% endif %}
