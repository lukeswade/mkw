{% extends "base.html" %}
{% block title %}Sign in · Deep Research{% endblock %}
{% block content %}
<section class="login-wrap">
  <article class="card login-card">
    <div class="login-header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <h2>Deep Research</h2>
    </div>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Password
        <input type="password" name="password" autofocus autocomplete="current-password">
      </label>
      <button type="submit">Sign in</button>
    </form>
  </article>
</section>
{% endblock %}
