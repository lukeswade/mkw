# SearXNG configuration for the deep-research stack.
# `use_default_settings: true` keeps everything stock except the overrides below.
use_default_settings: true

server:
  # Overridden by the SEARXNG_SECRET env var set in docker-compose.
  secret_key: "change_me"
  # The limiter needs a valkey instance and only matters for public instances;
  # this one is reachable solely from the internal Docker network.
  limiter: false
  image_proxy: false

search:
  # 'json' is required for the app's API access — without it
  # /search?format=json returns HTTP 403.
  formats:
    - html
    - json
  # One retry gives a transiently rate-limited engine a second chance before
  # the whole query comes back empty.
  max_page: 2

outgoing:
  # Appended to the outgoing User-Agent. Wikimedia's endpoints enforce their
  # UA policy — a bare "SearXNG/<version>" gets HTTP 403 on a real query while
  # the identical query with a contact URL gets 200. A URL satisfies the
  # policy, so nothing personal goes out.
  useragent_suffix: "(+https://github.com/lukeswade/deep-research)"
  request_timeout: 8.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

  # SearXNG's designed answer to the CAPTCHA problem, and the one lever never
  # tried here. Verified supported by this build:
  #   settings_defaults.py:262  'proxies': SettingsValue((None, str, dict), None)
  #
  # READ THIS BEFORE BUYING A PROXY. The type decides whether it helps or
  # hurts. DuckDuckGo and Startpage block datacenter ranges HARDER than
  # residential ones, so a cheap VPS SOCKS5 will CAPTCHA worse than this house
  # does — and would make the idea look disproven when it was only mistested.
  # Residential or mobile egress works; it costs roughly $5-15/GB.
  #
  # Measured on 2026-08-31, three isolated DuckDuckGo queries eight seconds
  # apart, no burst: CAPTCHA on all three, suspended_time=0. The address is
  # already judged, so lowering request volume cannot recover it — only
  # changing the address can.
  #
  # proxies:
  #   all://:
  #     - socks5://user:pass@host:port
  # Per-engine egress is also possible, on the engine's own entry:
  #   - name: duckduckgo
  #     network:
  #       proxies: socks5://user:pass@host:port

# Engine mix matters more here than on a general-purpose instance. The stock
# general category leans on Google/Brave/DuckDuckGo/Startpage, all of which
# rate-limit or serve CAPTCHAs to home and datacenter IPs under research-volume
# traffic — when they all trip at once a run silently finds nothing. The app
# therefore searches general + science + it (see SEARCH_CATEGORIES), which
# reaches engines that do not gate aggressively and are better sources for
# research anyway: Crossref, OpenAlex, Semantic Scholar, arXiv, Stack Overflow,
# GitHub, Hacker News.
# Scholarly results point at doi.org landing pages, which are often paywalled;
# this rewrites them to the open-access copy (oadoi.org) when one exists.
plugins:
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: true

engines:
  # --- video + community (the app reads YouTube via caption transcripts and
  # reddit threads via the JSON API — these engines let runs search them
  # directly through the videos / social media categories) ---
  - name: youtube
    disabled: false
  # This SearXNG no longer ships a reddit engine, so define one over
  # reddit's public search API with the generic JSON engine.
  - name: reddit
    engine: json_engine
    shortcut: re
    categories: social media
    disabled: false
    timeout: 8.0
    paging: false
    search_url: https://old.reddit.com/search.json?q={query}&limit=25&sort=relevance
    results_query: data/children
    url_query: data/permalink
    url_prefix: https://www.reddit.com
    title_query: data/title
    content_query: data/selftext
  # The default social-media engines return user-profile noise, not
  # discussions — reddit is the one this category is for.
  - name: mastodon users
    disabled: true
  - name: mastodon hashtags
    disabled: true
  - name: lemmy users
    disabled: true
  - name: lemmy communities
    disabled: true
  # tootfinder answers 'access denied' on every single query
  - name: tootfinder
    disabled: true

  # --- engines we never opted into that fail on every round ---
  # SearXNG queries these by default and WAITS for them, so each one is a
  # slice of the per-search budget spent on a guaranteed failure. Observed
  # across consecutive rounds of a depth-10 run: torrent trackers answering
  # 'access denied'/'parsing error', vimeo refusing outright, bing news
  # failing to parse. None of them can answer a research question.
  - name: kickass
    disabled: true
  - name: solidtorrents
    disabled: true
  - name: piratebay
    disabled: true
  - name: 1337x
    disabled: true
  - name: nyaa
    disabled: true
  - name: btdigg
    disabled: true
  - name: bt4g
    disabled: true
  - name: tokyotoshokan
    disabled: true
  - name: vimeo
    disabled: true
  - name: bing news
    disabled: true

  # --- dead weight inside `general` ---
  # These four sit in the general category and answer a research query with a
  # translation, a definition or an exchange rate. Every one is a slice of the
  # per-search budget and an outbound request against the same IP the gating
  # engines are already judging — 4 of general's 13 engines, spent on noise.
  - name: currency
    disabled: true
  - name: dictzone
    disabled: true
  - name: lingva
    disabled: true
  - name: mymemory translated
    disabled: true

  # --- indie indexes that do not gate on residential IPs ---
  # Google, Brave, DDG, Qwant and Startpage all CAPTCHA'd simultaneously on a
  # home connection, leaving `general` running on bing alone. These crawl and
  # serve their own indexes, so they answer when the majors will not — and
  # they index exactly the forum and hobbyist pages the majors bury, which is
  # where practical repair questions are actually answered.
  #
  # Measured on 2026-08-31 against a real failing query, at four query
  # lengths. These three answer, but only for SHORT queries — their indexes
  # are small and match closer to AND than to a sentence:
  #                       7w   5w   3w   2w
  #   boardreader          0    0    8    8
  #   searchmysite         1    4   10   10
  #   wiby                 0    1   12   12
  # The planner writes 5-8 word sub-queries, so today they contribute only
  # when it happens to write a short one. Worth revisiting by sending them a
  # keyword-shortened variant — not done yet, because a second query per
  # sub-query is more outbound volume against the IP the majors are already
  # rate-limiting.
  - name: boardreader        # forum search, also feeds `social media`
    disabled: true
  - name: searchmysite       # independent personal sites, also feeds `blogs`
    disabled: false
  - name: wiby               # small hand-made pages the majors rank last
    disabled: false
  # Measured dead, left off rather than left to burn a slice of every search:
  #   crowdview  0 results at every query length
  #   mwmbl      unresponsive on every query
  - name: crowdview
    disabled: true
  # mwmbl: an open index that does not gate residential addresses. Empty a
  # week ago, 8 results on the same query today — re-enabled and measured.
  - name: mwmbl
    disabled: false
    # 8 results in 0.5s on one query, a timeout that held the whole search
    # for 8s on the next. Cap what a bad moment can cost.
    timeout: 3.0

  # --- resilient general-web engines ---
  - name: mojeek
    disabled: true
  - name: bing
    disabled: false
  - name: qwant
    disabled: true
  - name: wikipedia
    disabled: false
  # Fails init on EVERY container start, reproducibly, and so never registers
  # a processor at all — it reports "answered, matched nothing" rather than
  # "refused", which is why it read as healthy for weeks. Failures logged
  # 08-22, 08-23, 08-27, 08-30 and twice on 08-31.
  #
  #   SearxEngineAccessDeniedException: HTTP error 403 (suspended_time=180)
  #   wikidata: engine init was not successful
  #
  # Not a User-Agent problem: the SPARQL endpoint returns 200 to both the
  # stock UA and a descriptive one from this address. It is the heavy
  # properties query init runs at startup that Wikidata refuses. That result
  # is cached on success — but EngineCache needs valkey, and this stack has
  # none, so it re-runs the heavy query on every start and can never stick.
  # Off until there is a valkey to cache into; a structured-entity engine is
  # marginal for document research, and leaving it on spends a large SPARQL
  # request plus a 180s suspension at every boot.
  # wikidata and wikipedia are INFOBOX engines: they populate the `infoboxes`
  # key and never the `results` key, and app/research/searcher.py reads only
  # `results`. Healthy or not, neither has ever contributed a single source to
  # a run — which is why wikipedia always read "empty" in check_engines.sh.
  # Measured before deciding: of the eight sub-queries the planner actually
  # wrote across two real runs, ZERO produced an infobox. They fire on bare
  # entity names ("titanium"), and the planner writes natural-language
  # sub-questions ("how to remove a stuck reel seat"). Where one does fire it
  # carries a Wikipedia URL the general engines already return anyway.
  # Off, so they stop taking a slot in every query. Wikipedia articles still
  # arrive through the general engines, which return en.wikipedia.org URLs the
  # fetcher can actually read.
  #
  # Their health was a separate matter and is now fixed: wikidata's init 403'd
  # at every boot for weeks. I blamed the heavy startup SPARQL query and the
  # absent valkey cache; both were wrong. The same query from the same address
  # returns 200 the moment the User-Agent carries a contact — see
  # outgoing.useragent_suffix above. An earlier probe that seemed to clear it
  # used a trivial query, and Wikimedia only enforces the policy on real ones.
  # That suffix also revived wikinews and wikibooks, which DO return results
  # and can be switched on if ever wanted.
  - name: wikidata
    inactive: true
  - name: wikipedia
    inactive: true

  # --- academic / primary sources ---
  - name: arxiv
    disabled: false
  - name: crossref
    disabled: false
  - name: semantic scholar
    disabled: false
  - name: openalex
    disabled: false

  # --- technical ---
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: hackernews
    disabled: false

  # --- keep the gated ones, but let them fail fast rather than stall a round ---
  - name: google
    timeout: 5.0
  - name: duckduckgo
    disabled: true
    timeout: 5.0
  - name: brave
    timeout: 5.0
  - name: startpage
    disabled: true
    timeout: 5.0

  # Engines whose api_key comes from the environment are inserted here at
  # container start by render-settings.sh — never committed. Keep this marker
  # as the LAST line of the engines list; keep any new top-level section above
  # `engines:`, not below this.
  # --- pruned on 2026-09-04 against 38 runs of this install's own data ---
  # Every one of these refused most or all runs for two weeks and never
  # contributed a page that was read (duckduckgo, qwant, startpage: 38 of 38
  # refused, CAPTCHA; mojeek: 28 of 38 and empty when it answers; boardreader:
  # parsing error on every search since 2026-09-02; startpage news 19/38,
  # wikinews 19/38, wikicommons.videos 20/38 — all with zero reads). Each
  # refused engine still cost a slice of every search and a strike against
  # the shared address. Left declared, off, so they can return; the Learned
  # page's engine table is where to look before turning one back on.
  - name: startpage news
    disabled: true
  - name: wikinews
    disabled: true
  - name: wikicommons.videos
    disabled: true

  # Tor-only engines: 'can't register engine (loading engine failed)' on every
  # start, since there is no Tor here. Off so the log says something useful.
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true

  # @@ API_ENGINES @@
