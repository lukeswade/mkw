<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Turn your 3D printing ideas into downloadable .STL and .3MF files powered by Cloudflare AI. Real-time WebGL preview & slicer estimates." />
    
    <!-- OpenGraph / Social -->
    <meta property="og:title" content="MKW 3D | AI 3D Printing Generator" />
    <meta property="og:description" content="Generate 3D printable STL and 3MF models instantly with Cloudflare Workers AI." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mattkwade.com" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <title>MKW 3D | AI 3D Printing Generator (STL / 3MF)</title>
  </head>
  <body class="bg-[#090d16] text-slate-100 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
