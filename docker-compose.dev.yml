# Development overrides — NOT auto-loaded, so a plain `docker compose up -d`
# on the server always runs production-shaped. Use via scripts/dev.sh:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    build:
      context: .
      target: dev
    # Distinct tag: sharing `mkw-app` with the prod target means a prod build
    # silently replaces the test image and pytest disappears.
    image: mkw-app-dev
    volumes:
      - ./data:/data
      - ./app:/srv/app/app
      - ./tests:/srv/app/tests
      - ./pyproject.toml:/srv/app/pyproject.toml:ro
    command: ["uvicorn", "app.web.server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8090", "--reload"]
    healthcheck:
      disable: true

  searxng:
    ports:
      - "127.0.0.1:8081:8080"
